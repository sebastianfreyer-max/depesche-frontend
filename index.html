      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Fundamental Brigade';
      src: url(data:font/ttf;base64,AAEAAAALAIAAAwAwT1MvMJFAUqIAAADMAAAAVmNtYXCX7tO3AAABHAAAAEZnbHlmY9D8vgAAASAAAACkaGVhZGS2iVoAAADQAAAANmhoZWENBwC7AAAA7AAAACRobXR4D+oAkAAAAYAAAAAMbG9jYQMOA2gAAAGcAAAACG1heHABBgBoAAABqAAAACBuYW1lT01M/wAAAbgAAAFacG9zdAbLAGEAAAIIAAAAIAABAAAAAwAAAwAAEAAAAQAAFgD8/2QACwD6AAAAAAAAA5sAFgD6AAAAFgD6AAAAAAAAAA==) format('truetype');
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --paper: #F1F0EC;
      --surface: #FBFBF9;
      --ink: #1B1A17;
      --ink-soft: #57544E;
      --ink-body: #34322D;
      --rule: #D9D7CF;
      --accent: rgb(230, 117, 117);
      --accent-wash: rgba(230, 117, 117, 0.1);
      --meta-grey: #999;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(27, 26, 23, 0.16);
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #161513;
        --surface: #201F1C;
        --ink: #F1F0EC;
        --ink-soft: #A8A49C;
        --ink-body: #D8D5CE;
        --rule: #3A3834;
        --accent: rgb(235, 140, 140);
        --accent-wash: rgba(235, 140, 140, 0.14);
        --meta-grey: #8A8680;
        --glass-bg: rgba(32, 31, 28, 0.4);
        --glass-border: rgba(241, 240, 236, 0.22);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { background: var(--paper); }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Fundamental Brigade', Georgia, serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: background 0.2s, color 0.2s;
    }

    #app { display: flex; flex-direction: column; height: 100%; }

    .header {
      border-bottom: 2px solid var(--ink);
      padding: calc(env(safe-area-inset-top) + 30px) 16px 16px;
      flex-shrink: 0;
    }

    .title {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 2.5rem;
      letter-spacing: -0.03em;
      line-height: 0.92;
      margin-bottom: 8px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .subtitle {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.7rem;
      color: var(--ink-soft);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .filter-toggle {
      font-family: 'Fundamental Brigade', sans-serif;
      font-size: 0.72rem;
      background: none;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-toggle.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0;
    }

    .article-item {
      padding: 16px 48px 16px 16px;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .article-item:active { background: var(--surface); }

    .bookmark-btn {
      position: absolute;
      top: 14px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--rule);
      cursor: pointer;
      padding: 4px;
    }

    .bookmark-btn.is-saved {
      color: var(--accent);
    }

    .article-headline {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.2;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .article-summary {
      font-size: 0.9rem;
      color: var(--ink-soft);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .article-meta {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.65rem;
      color: var(--meta-grey);
      letter-spacing: 0.08em;
    }

    .article-source {
      color: var(--accent);
      font-weight: 500;
    }

    /* Detail View */
    .detail-view {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--paper);
      z-index: 1000;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-view.active { display: flex; }

    .detail-header {
      padding: calc(env(safe-area-inset-top) + 30px) 16px 16px;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }

    .detail-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .detail-back {
      font-family: 'Fundamental Brigade', sans-serif;
      font-size: 0.9rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      margin-bottom: 0;
    }

    .detail-back:active { text-decoration: underline; }

    .detail-save {
      font-family: 'Fundamental Brigade', sans-serif;
      font-size: 0.8rem;
      background: none;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
    }

    .detail-save.is-saved {
      border-color: var(--accent);
      color: var(--accent);
    }

    .detail-headline {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .detail-meta {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.7rem;
      color: var(--ink-soft);
      letter-spacing: 0.08em;
    }

    .detail-source {
      color: var(--accent);
      font-weight: 500;
    }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 16px;
    }

    .detail-content {
      padding: 16px 0;
      line-height: 1.6;
      color: var(--ink-body);
    }

    .detail-content p {
      margin-bottom: 12px;
    }

    .detail-fazit {
      background: var(--accent-wash);
      border-left: 3px solid var(--accent);
      padding: 14px;
      margin: 20px 0 40px;
      border-radius: 2px;
    }

    .detail-fazit-label {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .detail-fazit-text {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .claude-fab {
      position: fixed;
      right: calc(18px + env(safe-area-inset-right));
      bottom: calc(20px + env(safe-area-inset-bottom));
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      color: var(--accent);
      border: 1.3px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
      z-index: 1100;
      transition: transform 0.12s;
    }

    .claude-fab:active {
      transform: scale(0.92);
      border-color: var(--accent);
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: var(--accent);
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    class Depesche {
      constructor() {
        this.articles = [];
        this.selectedArticle = null;
        this.showSavedOnly = false;
        this.savedIds = new Set(JSON.parse(localStorage.getItem('depesche_saved') || '[]'));
        this.init();
      }

      articleId(article) {
        return article.link || (article.source + '|' + article.headline);
      }

      toggleSave(id) {
        if (this.savedIds.has(id)) {
          this.savedIds.delete(id);
        } else {
          this.savedIds.add(id);
        }
        localStorage.setItem('depesche_saved', JSON.stringify([...this.savedIds]));
        this.render();
      }

      async init() {
        this.render();
        await this.loadArticles();
      }

      async loadArticles() {
        try {
          // Lade Meldungen vom Backend (kostenlose RSS-Kuration)
          const res = await fetch('https://depesche-backend-iota.vercel.app/api/articles');
          if (!res.ok) throw new Error('Backend nicht erreichbar: ' + res.status);
          const data = await res.json();
          this.articles = data.articles || [];
          this.render();
        } catch (e) {
          console.error('Fehler beim Laden:', e.message);
          this.articles = [];
          this.render();
        }
      }

      selectArticle(index) {
        this.selectedArticle = index;
        this.render();
      }

      closeDetail() {
        this.selectedArticle = null;
        this.render();
      }

      attachSwipeBack(el) {
        if (!el) return;
        let startX = null, startY = null, tracking = false;

        el.addEventListener('touchstart', (e) => {
          const t = e.touches[0];
          if (t.clientX < 28) {
            startX = t.clientX;
            startY = t.clientY;
            tracking = true;
          } else {
            tracking = false;
          }
        }, { passive: true });

        el.addEventListener('touchend', (e) => {
          if (!tracking || startX === null) return;
          const t = e.changedTouches[0];
          const dx = t.clientX - startX;
          const dy = Math.abs(t.clientY - startY);
          if (dx > 70 && dy < 60) {
            this.closeDetail();
          }
          tracking = false;
          startX = null;
        }, { passive: true });
      }

      askClaude(articleIndex) {
        const article = this.articles[articleIndex];
        if (!article) return;

        const prompt = `Ich lese gerade folgende KI-Nachricht und würde gerne mehr dazu wissen:\n\n"${article.headline}"\n\n${article.summary}\n\nQuelle: ${article.source}${article.link ? ' (' + article.link + ')' : ''}\n\nKannst du mir den Hintergrund erklären und einschätzen, warum das relevant ist?`;

        // Kopiere Frage in Zwischenablage (funktioniert komplett kostenlos mit deinem bestehenden Claude-Konto)
        if (navigator.clipboard) {
          navigator.clipboard.writeText(prompt).then(() => {
            alert('Frage wurde kopiert! Öffne Claude und füge sie ein (Cmd+V bzw. Einfügen).');
            window.open('https://claude.ai/new', '_blank');
          }).catch(() => {
            window.open('https://claude.ai/new', '_blank');
          });
        } else {
          window.open('https://claude.ai/new', '_blank');
        }
      }

      render() {
        const app = document.getElementById('app');
        
        if (this.selectedArticle !== null) {
          // Detail View
          const article = this.articles[this.selectedArticle];
          if (!article) {
            app.innerHTML = '<div class="empty">Artikel nicht gefunden</div>';
            return;
          }

          const isSaved = this.savedIds.has(this.articleId(article));

          app.innerHTML = `
            <div class="detail-view active">
              <div class="detail-header">
                <div class="detail-header-top">
                  <button class="detail-back">← Zurück</button>
                  <button class="detail-save${isSaved ? ' is-saved' : ''}" data-save-detail="1">${isSaved ? '★ Gemerkt' : '☆ Merken'}</button>
                </div>
                <h1 class="detail-headline">${article.headline}</h1>
                <div class="detail-meta"><span class="detail-source">${article.source || 'Quelle'}</span> · ${article.date || 'Datum'}</div>
              </div>
              <div class="detail-scroll">
                <div class="detail-content">
                  <p style="font-style: italic; color: var(--ink-soft); font-size: 0.82rem;">Schlagzeile & Kurzfassung auf Deutsch übersetzt · Originaltext unten auf Englisch</p>
                  ${article.content ? article.content.split('\n').map(p => `<p>${p}</p>`).join('') : '<p>' + article.summary + '</p>'}
                  <div class="detail-fazit">
                    <div class="detail-fazit-label">Weiterlesen</div>
                    <div class="detail-fazit-text">
                      ${article.link ? `<a href="${article.link}" target="_blank" style="color: var(--accent);">Zum Originalartikel bei ${article.source} →</a>` : 'Quelle: ' + article.source}
                    </div>
                  </div>
                </div>
              </div>
              <button class="claude-fab" data-ask="1" aria-label="Mit Claude besprechen" title="Mit Claude besprechen">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          `;
          
          document.querySelector('.detail-back').addEventListener('click', () => this.closeDetail());
          this.attachSwipeBack(document.querySelector('.detail-view'));
          const askBtn = document.querySelector('[data-ask]');
          if (askBtn) askBtn.addEventListener('click', () => this.askClaude(this.selectedArticle));
          const saveDetailBtn = document.querySelector('[data-save-detail]');
          if (saveDetailBtn) saveDetailBtn.addEventListener('click', () => this.toggleSave(this.articleId(article)));
        } else {
          // List View
          const visibleArticles = this.showSavedOnly
            ? this.articles.map((a, i) => ({ a, i })).filter(({ a }) => this.savedIds.has(this.articleId(a)))
            : this.articles.map((a, i) => ({ a, i }));

          const articlesHtml = visibleArticles.length > 0
            ? visibleArticles.map(({ a: article, i }) => {
                const saved = this.savedIds.has(this.articleId(article));
                return `
              <div class="article-item" data-index="${i}">
                <button class="bookmark-btn${saved ? ' is-saved' : ''}" data-save="${i}" aria-label="Merken">${saved ? '★' : '☆'}</button>
                <div class="article-headline">${article.headline}</div>
                <div class="article-summary">${article.summary}</div>
                <div class="article-meta"><span class="article-source">${article.source || 'Quelle'}</span> · ${article.date || 'Datum'}</div>
              </div>
            `;}).join('')
            : `<div class="empty">${this.showSavedOnly ? 'Noch keine gemerkten Artikel.' : 'Keine Meldungen verfügbar. Bitte später versuchen.'}</div>`;

          app.innerHTML = `
            <div id="app-inner" style="display: flex; flex-direction: column; height: 100%;">
              <div class="header">
                <h1 class="title">DEPESCHE</h1>
                <div class="header-row">
                  <div class="subtitle">Internationale KI-News, täglich kuriert</div>
                  <button class="filter-toggle${this.showSavedOnly ? ' active' : ''}" data-toggle-saved="1">${this.showSavedOnly ? '★ Gemerkt' : '☆ Gemerkt'}</button>
                </div>
              </div>
              <div class="feed">${articlesHtml}</div>
            </div>
          `;

          // Attach listeners
          document.querySelectorAll('.article-item').forEach((item) => {
            item.addEventListener('click', (e) => {
              if (e.target.closest('.bookmark-btn')) return;
              const index = parseInt(item.dataset.index);
              this.selectArticle(index);
            });
          });
          document.querySelectorAll('[data-save]').forEach((btn) => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const idx = parseInt(btn.dataset.save);
              this.toggleSave(this.articleId(this.articles[idx]));
            });
          });
          const toggleBtn = document.querySelector('[data-toggle-saved]');
          if (toggleBtn) toggleBtn.addEventListener('click', () => {
            this.showSavedOnly = !this.showSavedOnly;
            this.render();
          });
        }
      }
    }

    new Depesche();
  </script>
</body>
</html>
