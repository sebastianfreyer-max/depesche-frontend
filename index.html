    :root {
      --paper: #F1F0EC;
      --surface: #FBFBF9;
      --ink: #1B1A17;
      --ink-soft: #57544E;
      --ink-body: #34322D;
      --rule: #D9D7CF;
      --accent: rgb(230, 117, 117);
      --accent-wash: rgba(230, 117, 117, 0.1);
      --meta-grey: #999;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(27, 26, 23, 0.16);
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #161513;
        --surface: #201F1C;
        --ink: #F1F0EC;
        --ink-soft: #A8A49C;
        --ink-body: #D8D5CE;
        --rule: #3A3834;
        --accent: rgb(235, 140, 140);
        --accent-wash: rgba(235, 140, 140, 0.14);
        --meta-grey: #8A8680;
        --glass-bg: rgba(32, 31, 28, 0.4);
        --glass-border: rgba(241, 240, 236, 0.22);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { background: var(--paper); }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Fundamental Brigade', Georgia, serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: background 0.2s, color 0.2s;
    }

    #app { display: flex; flex-direction: column; height: 100%; position: relative; }

    #list-view {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      border-bottom: 2px solid var(--ink);
      padding: calc(env(safe-area-inset-top) + 30px) 16px 16px;
      flex-shrink: 0;
    }

    .title {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 2.15rem;
      letter-spacing: -0.03em;
      line-height: 0.92;
      margin-bottom: 8px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .subtitle {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.7rem;
      color: var(--ink-soft);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .filter-toggle {
      font-family: 'Fundamental Brigade', sans-serif;
      font-size: 0.72rem;
      background: none;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-toggle.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0;
    }

    .article-item {
      padding: 16px 48px 16px 16px;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .article-item:active { background: var(--surface); }

    .article-item.is-top {
      border-left: 3px solid var(--accent);
      padding-left: 20px;
      background: var(--accent-wash);
    }

    .top-badge {
      display: inline-block;
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 2px 8px;
      margin-bottom: 8px;
    }

    .bookmark-btn {
      position: absolute;
      top: 14px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--rule);
      cursor: pointer;
      padding: 4px;
    }

    .bookmark-btn.is-saved {
      color: var(--accent);
    }

    .article-headline {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.2;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .article-summary {
      font-size: 0.9rem;
      color: var(--ink-soft);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .article-meta {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.65rem;
      color: var(--meta-grey);
      letter-spacing: 0.08em;
    }

    .article-source {
      color: var(--accent);
      font-weight: 500;
    }

    /* Detail View */
    .detail-view {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--paper);
      z-index: 1000;
      flex-direction: column;
      overflow: hidden;
      will-change: transform;
    }

    .detail-view.active { display: flex; }

    .detail-header {
      padding: calc(env(safe-area-inset-top) + 30px) 16px 16px;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }

    .detail-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .detail-back {
      font-family: 'Fundamental Brigade', sans-serif;
      font-size: 0.9rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      margin-bottom: 0;
    }

    .detail-back:active { text-decoration: underline; }

    .detail-save {
      font-family: 'Fundamental Brigade', sans-serif;
      font-size: 0.8rem;
      background: none;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
    }

    .detail-save.is-saved {
      border-color: var(--accent);
      color: var(--accent);
    }

    .detail-headline {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .detail-meta {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.7rem;
      color: var(--ink-soft);
      letter-spacing: 0.08em;
    }

    .detail-source {
      color: var(--accent);
      font-weight: 500;
    }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 16px;
    }

    .detail-content {
      padding: 16px 0;
      line-height: 1.6;
      color: var(--ink-body);
    }

    .detail-content p {
      margin-bottom: 12px;
    }

    .detail-fazit {
      background: var(--accent-wash);
      border-left: 3px solid var(--accent);
      padding: 14px;
      margin: 20px 0 40px;
      border-radius: 2px;
    }

    .detail-fazit-label {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .detail-fazit-text {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .claude-fab {
      position: fixed;
      right: calc(18px + env(safe-area-inset-right));
      bottom: calc(20px + env(safe-area-inset-bottom));
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      color: var(--accent);
      border: 1.3px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
      z-index: 1100;
      transition: transform 0.12s;
    }

    .claude-fab:active {
      transform: scale(0.92);
      border-color: var(--accent);
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: var(--accent);
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--ink-soft);
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 65vh;
      padding: 0;
      text-align: center;
    }

    .loading-mark-wrap {
      position: relative;
      width: 100%;
      height: 64px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .loading-mark {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }

    .loading-D-letter {
      display: block;
      height: 44px;
      width: auto;
    }

    @media (prefers-color-scheme: dark) {
      .loading-D-letter { filter: invert(1); }
    }

    .loading-dot {
      position: absolute;
      top: 34px;
      left: -18px;
      width: 12px;
      height: 12px;
      background: var(--accent);
      transform-origin: center bottom;
    }

    .loading-text {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding: 0 20px;
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-dot { animation: none; left: 50%; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    class Depesche {
      constructor() {
        this.articles = [];
        this.selectedArticle = null;
        this.showSavedOnly = false;
        this.isLoading = true;
        this.savedIds = new Set(JSON.parse(localStorage.getItem('depesche_saved') || '[]'));
        this.mountSkeleton();
        this.init();
      }

      mountSkeleton() {
        document.getElementById('app').innerHTML = `
          <div id="list-view"></div>
          <div class="detail-view" id="detail-view"></div>
        `;
        this.attachSwipeBack(document.getElementById('detail-view'));
      }

      articleId(article) {
        return article.link || (article.source + '|' + article.headline);
      }

      toggleSave(id) {
        if (this.savedIds.has(id)) {
          this.savedIds.delete(id);
        } else {
          this.savedIds.add(id);
        }
        localStorage.setItem('depesche_saved', JSON.stringify([...this.savedIds]));
        this.renderList();
        if (this.selectedArticle !== null) this.renderDetail();
      }

      async init() {
        this.renderList();
        await this.loadArticles();
      }

      async loadArticles() {
        try {
          // Lade Meldungen vom Backend (kostenlose RSS-Kuration)
          const res = await fetch('https://depesche-backend-iota.vercel.app/api/articles');
          if (!res.ok) throw new Error('Backend nicht erreichbar: ' + res.status);
          const data = await res.json();
          this.articles = data.articles || [];
          this.isLoading = false;
          this.renderList();
        } catch (e) {
          console.error('Fehler beim Laden:', e.message);
          this.articles = [];
          this.isLoading = false;
          this.renderList();
        }
      }

      selectArticle(index) {
        this.selectedArticle = index;
        this.renderDetail();
      }

      // Misst den Buchstaben pixelgenau über Canvas (wie beim App-Icon-Build) statt über
      // die DOM-Layoutbox, die durch Schriftart-Metadaten (Zeilenhöhe, Unterlängen-Reserve) verfälscht ist
      positionLoadingAnimation(listEl) {
        const letterEl = listEl.querySelector('.loading-D-letter');
        const dotEl = listEl.querySelector('.loading-dot');
        const wrapEl = listEl.querySelector('.loading-mark-wrap');
        const markEl = listEl.querySelector('.loading-mark');
        if (!letterEl || !dotEl || !wrapEl || !markEl) return;

        // Das Bild enthält den Eck-Ausschnitt bereits exakt wie im App-Icon (18% der Höhe = Aussparung).
        // Der animierte Punkt muss nur noch exakt an dieser Stelle andocken.
        const letterRect = letterEl.getBoundingClientRect();
        const wrapRect = wrapEl.getBoundingClientRect();
        const markRect = markEl.getBoundingClientRect();

        const dotSize = Math.max(4, Math.round(letterRect.height * 0.1774));
        dotEl.style.width = dotSize + 'px';
        dotEl.style.height = dotSize + 'px';

        const topInWrap = letterRect.bottom - wrapRect.top - dotSize;
        dotEl.style.top = topInWrap + 'px';

        // Würfel-Überschlag: pro Viertelumdrehung genau eine Kantenlänge weiter, quer über den ganzen Screen
        const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReduced) {
          dotEl.style.left = '50%';
        } else {
          const travel = wrapRect.width + dotSize * 2;
          const steps = Math.max(4, Math.round(travel / dotSize));
          const duration = (steps * 0.22).toFixed(2);
          let kf = '@keyframes rollTumble {';
          for (let i = 0; i <= steps; i++) {
            const pct = (i / steps * 100).toFixed(3);
            const xPos = (i * dotSize - dotSize).toFixed(1);
            const rot = i * 90;
            kf += `${pct}%{transform:translateX(${xPos}px) rotate(${rot}deg);}`;
          }
          kf += '}';

          let styleEl = document.getElementById('roll-kf-style');
          if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'roll-kf-style';
            document.head.appendChild(styleEl);
          }
          styleEl.textContent = kf;
          dotEl.style.left = '0px';
          dotEl.style.animation = `rollTumble ${duration}s linear infinite`;
        }
      }

      // Passt die Schriftgröße von "DATENRADAR" so an, dass ihr rechter Rand exakt
      // mit dem rechten Rand von "TÄGLICH" in der Unterzeile abschließt — live gemessen,
      // da der Zeilenumbruch der Unterzeile je nach Bildschirmbreite variiert.
      async alignTitleToSubtitle(listEl) {
        const titleEl = listEl.querySelector('#title-text');
        const targetEl = listEl.querySelector('#subtitle-daily');
        if (!titleEl || !targetEl) return;
        const titleH1 = titleEl.parentElement;

        // Warten, bis die eigentliche Schriftart wirklich geladen ist — sonst misst der
        // Browser kurzzeitig an einer schmaleren Ersatzschrift und die Rechnung stimmt nicht
        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
            if (document.fonts.load) {
              await Promise.all([
                document.fonts.load('700 100px "Fundamental Brigade"'),
                document.fonts.load('400 100px "Fundamental Brigade Condensed"'),
              ]);
            }
          }
        } catch (e) {}
        await new Promise((r) => requestAnimationFrame(r));

        // Basisgröße einmalig festhalten (aus der echten CSS-Regel, nicht aus einer
        // eventuell bereits von einem früheren Durchlauf veränderten Inline-Größe),
        // damit sich Anpassungen nicht über mehrere Render-Durchläufe aufsummieren
        if (!this._baseTitleFontSize) {
          titleH1.style.fontSize = '';
          this._baseTitleFontSize = parseFloat(getComputedStyle(titleH1).fontSize);
        }

        // Immer von der Basisgröße aus neu messen, nie von einer vorherigen Anpassung aus
        titleH1.style.fontSize = this._baseTitleFontSize + 'px';

        const titleRect = titleEl.getBoundingClientRect();
        const targetRect = targetEl.getBoundingClientRect();
        if (titleRect.width === 0 || targetRect.width === 0) return;

        const desiredWidth = targetRect.right - titleRect.left;
        const currentWidth = titleRect.right - titleRect.left;
        if (currentWidth <= 0) return;

        let newSize = this._baseTitleFontSize * (desiredWidth / currentWidth);
        // Bündig in BEIDE Richtungen: vergrößern UND verkleinern erlaubt,
        // nur mit sinnvollen Sicherheitsgrenzen (nicht winzig, nicht überbordend)
        const minSize = 18;
        const maxSize = this._baseTitleFontSize * 1.8;
        newSize = Math.max(minSize, Math.min(newSize, maxSize));
        titleH1.style.fontSize = newSize + 'px';
      }

      closeDetail() {
        this.selectedArticle = null;
        const el = document.getElementById('detail-view');
        if (!el) return;
        el.classList.remove('active');
        el.style.transition = 'none';
        el.style.transform = '';
        requestAnimationFrame(() => { el.style.transition = ''; });
      }

      attachSwipeBack(el) {
        if (!el) return;
        const EDGE = 36;
        const COMMIT_DISTANCE = 100;
        const COMMIT_VELOCITY = 0.5;
        let startX = 0, startY = 0, startT = 0, currentX = 0, tracking = false;

        const onStart = (e) => {
          const t = e.touches[0];
          if (t.clientX <= EDGE) {
            startX = t.clientX;
            startY = t.clientY;
            startT = Date.now();
            currentX = 0;
            tracking = true;
            el.style.transition = 'none';
          } else {
            tracking = false;
          }
        };

        const onMove = (e) => {
          if (!tracking) return;
          const t = e.touches[0];
          const dx = t.clientX - startX;
          const dy = t.clientY - startY;
          if (dx < 0) return;
          if (Math.abs(dy) > 60 && Math.abs(dy) > dx) {
            tracking = false;
            el.style.transition = '';
            el.style.transform = '';
            return;
          }
          currentX = dx;
          el.style.transform = `translateX(${dx}px)`;
          if (e.cancelable) e.preventDefault();
        };

        const onEnd = () => {
          if (!tracking) return;
          tracking = false;
          const dt = Date.now() - startT;
          const velocity = currentX / Math.max(dt, 1);
          el.style.transition = 'transform 0.22s ease';
          if (currentX > COMMIT_DISTANCE || velocity > COMMIT_VELOCITY) {
            el.style.transform = 'translateX(100%)';
            setTimeout(() => this.closeDetail(), 200);
          } else {
            el.style.transform = 'translateX(0)';
            setTimeout(() => { el.style.transition = ''; }, 220);
          }
        };

        el.addEventListener('touchstart', onStart, { passive: true });
        el.addEventListener('touchmove', onMove, { passive: false });
        el.addEventListener('touchend', onEnd, { passive: true });
        el.addEventListener('touchcancel', onEnd, { passive: true });
      }

      askClaude(articleIndex) {
        const article = this.articles[articleIndex];
        if (!article) return;

        const prompt = `Ich lese gerade folgende KI-Nachricht und würde gerne mehr dazu wissen:\n\n"${article.headline}"\n\n${article.summary}\n\nQuelle: ${article.source}${article.link ? ' (' + article.link + ')' : ''}\n\nKannst du mir den Hintergrund erklären und einschätzen, warum das relevant ist?`;

        // Kopiere Frage in Zwischenablage (funktioniert komplett kostenlos mit deinem bestehenden Claude-Konto)
        if (navigator.clipboard) {
          navigator.clipboard.writeText(prompt).then(() => {
            alert('Frage wurde kopiert! Öffne Claude und füge sie ein (Cmd+V bzw. Einfügen).');
            window.open('https://claude.ai/new', '_blank');
          }).catch(() => {
            window.open('https://claude.ai/new', '_blank');
          });
        } else {
          window.open('https://claude.ai/new', '_blank');
        }
      }

      renderDetail() {
        const detailEl = document.getElementById('detail-view');
        if (!detailEl) return;

        if (this.selectedArticle === null) {
          detailEl.classList.remove('active');
          return;
        }

        const article = this.articles[this.selectedArticle];
        if (!article) {
          detailEl.classList.remove('active');
          return;
        }

        const isSaved = this.savedIds.has(this.articleId(article));

        detailEl.innerHTML = `
          <div class="detail-header">
            <div class="detail-header-top">
              <button class="detail-back">← Zurück</button>
              <button class="detail-save${isSaved ? ' is-saved' : ''}" data-save-detail="1">${isSaved ? '★ Gemerkt' : '☆ Merken'}</button>
            </div>
            <h1 class="detail-headline">${article.headline}</h1>
            <div class="detail-meta"><span class="detail-source">${article.source || 'Quelle'}</span> · ${article.date || 'Datum'}</div>
          </div>
          <div class="detail-scroll">
            <div class="detail-content">
              ${article.content ? article.content.split('\n').map(p => `<p>${p}</p>`).join('') : '<p>' + article.summary + '</p>'}
              <div class="detail-fazit">
                <div class="detail-fazit-label">Weiterlesen</div>
                <div class="detail-fazit-text">
                  ${article.link ? `<a href="${article.link}" target="_blank" style="color: var(--accent);">Zum Originalartikel bei ${article.source} →</a>` : 'Quelle: ' + article.source}
                </div>
              </div>
            </div>
          </div>
          <button class="claude-fab" data-ask="1" aria-label="Mit Claude besprechen" title="Mit Claude besprechen">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
          </button>
        `;

        detailEl.style.transition = 'none';
        detailEl.style.transform = '';
        detailEl.classList.add('active');
        requestAnimationFrame(() => { detailEl.style.transition = ''; });

        detailEl.querySelector('.detail-back').addEventListener('click', () => this.closeDetail());
        const askBtn = detailEl.querySelector('[data-ask]');
        if (askBtn) askBtn.addEventListener('click', () => this.askClaude(this.selectedArticle));
        const saveDetailBtn = detailEl.querySelector('[data-save-detail]');
        if (saveDetailBtn) saveDetailBtn.addEventListener('click', () => this.toggleSave(this.articleId(article)));
      }

            <div class="header-row">
              <div class="subtitle">Internationale KI-News, <span id="subtitle-daily">täglich</span> kuriert</div>
              <button class="filter-toggle${this.showSavedOnly ? ' active' : ''}" data-toggle-saved="1">${this.showSavedOnly ? '★ Gemerkt' : '☆ Gemerkt'}</button>
            </div>
          </div>
          <div class="feed">${feedHtml}</div>
        `;

        if (this.isLoading) {
          this.positionLoadingAnimation(listEl);
        }

        this.alignTitleToSubtitle(listEl);

        // Attach listeners
        listEl.querySelectorAll('.article-item').forEach((item) => {
          item.addEventListener('click', (e) => {
            if (e.target.closest('.bookmark-btn')) return;
            const index = parseInt(item.dataset.index);
            this.selectArticle(index);
          });
        });
        listEl.querySelectorAll('[data-save]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.save);
            this.toggleSave(this.articleId(this.articles[idx]));
          });
        });
        const toggleBtn = listEl.querySelector('[data-toggle-saved]');
        if (toggleBtn) toggleBtn.addEventListener('click', () => {
          this.showSavedOnly = !this.showSavedOnly;
          this.renderList();
        });
      }
    }

    new Depesche();
  </script>
</body>
</html>
