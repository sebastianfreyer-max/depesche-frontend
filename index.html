    @font-face {
      font-family: 'Fundamental Brigade';
      src: url(data:font/ttf;base64,AAEAAAALAIAAAwAwT1MvMJFAUqIAAADMAAAAVmNtYXCX7tO3AAABHAAAAEZnbHlmY9D8vgAAASAAAACkaGVhZGS2iVoAAADQAAAANmhoZWENBwC7AAAA7AAAACRobXR4D+oAkAAAAYAAAAAMbG9jYQMOA2gAAAGcAAAACG1heHABBgBoAAABqAAAACBuYW1lT01M/wAAAbgAAAFacG9zdAbLAGEAAAIIAAAAIAABAAAAAwAAAwAAEAAAAQAAFgD8/2QACwD6AAAAAAAAA5sAFgD6AAAAFgD6AAAAAAAAAA==) format('truetype');
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --paper: #F1F0EC;
      --surface: #FBFBF9;
      --ink: #1B1A17;
      --ink-soft: #57544E;
      --ink-body: #34322D;
      --rule: #D9D7CF;
      --accent: rgb(230, 117, 117);
      --accent-wash: rgba(230, 117, 117, 0.1);
      --meta-grey: #999;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #161513;
        --surface: #201F1C;
        --ink: #F1F0EC;
        --ink-soft: #A8A49C;
        --ink-body: #D8D5CE;
        --rule: #3A3834;
        --accent: rgb(235, 140, 140);
        --accent-wash: rgba(235, 140, 140, 0.14);
        --meta-grey: #8A8680;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { background: var(--paper); }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Fundamental Brigade', Georgia, serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: background 0.2s, color 0.2s;
    }

    #app { display: flex; flex-direction: column; height: 100%; }

    .header {
      border-bottom: 2px solid var(--ink);
      padding: max(16px, env(safe-area-inset-top)) 16px 16px;
      flex-shrink: 0;
    }

    .title {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 2.5rem;
      letter-spacing: -0.03em;
      line-height: 0.92;
      margin-bottom: 8px;
    }

    .subtitle {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.7rem;
      color: var(--ink-soft);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0;
    }

    .article-item {
      padding: 16px;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      transition: background 0.15s;
    }

    .article-item:active { background: var(--surface); }

    .article-headline {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.2;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .article-summary {
      font-size: 0.9rem;
      color: var(--ink-soft);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .article-meta {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.65rem;
      color: var(--meta-grey);
      letter-spacing: 0.08em;
    }

    /* Detail View */
    .detail-view {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--paper);
      z-index: 1000;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-view.active { display: flex; }

    .detail-header {
      padding: max(16px, env(safe-area-inset-top)) 16px 16px;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }

    .detail-back {
      font-family: 'Fundamental Brigade', sans-serif;
      font-size: 0.9rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .detail-back:active { text-decoration: underline; }

    .detail-headline {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .detail-meta {
      font-family: 'Fundamental Brigade', monospace;
      font-size: 0.7rem;
      color: var(--ink-soft);
      letter-spacing: 0.08em;
    }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 16px;
    }

    .detail-content {
      padding: 16px 0;
      line-height: 1.6;
      color: var(--ink-body);
    }

    .detail-content p {
      margin-bottom: 12px;
    }

    .detail-fazit {
      background: var(--accent-wash);
      border-left: 3px solid var(--accent);
      padding: 14px;
      margin: 20px 0 40px;
      border-radius: 2px;
    }

    .detail-fazit-label {
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .detail-fazit-text {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .detail-ask-claude {
      display: block;
      width: 100%;
      font-family: 'Fundamental Brigade', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      background: var(--ink);
      color: var(--paper);
      border: none;
      padding: 14px;
      cursor: pointer;
      margin-bottom: 40px;
      border-radius: 2px;
    }

    .detail-ask-claude:active {
      background: var(--accent);
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: var(--accent);
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    class Depesche {
      constructor() {
        this.articles = [];
        this.selectedArticle = null;
        this.init();
      }

      async init() {
        this.render();
        await this.loadArticles();
      }

      async loadArticles() {
        try {
          // Lade Meldungen vom Backend (kostenlose RSS-Kuration)
          const res = await fetch('https://depesche-backend-iota.vercel.app/api/articles');
          if (!res.ok) throw new Error('Backend nicht erreichbar: ' + res.status);
          const data = await res.json();
          this.articles = data.articles || [];
          this.render();
        } catch (e) {
          console.error('Fehler beim Laden:', e.message);
          this.articles = [];
          this.render();
        }
      }

      selectArticle(index) {
        this.selectedArticle = index;
        this.render();
      }

      closeDetail() {
        this.selectedArticle = null;
        this.render();
      }

      askClaude(articleIndex) {
        const article = this.articles[articleIndex];
        if (!article) return;

        const prompt = `Ich lese gerade folgende KI-Nachricht und würde gerne mehr dazu wissen:\n\n"${article.headline}"\n\n${article.summary}\n\nQuelle: ${article.source}${article.link ? ' (' + article.link + ')' : ''}\n\nKannst du mir den Hintergrund erklären und einschätzen, warum das relevant ist?`;

        // Kopiere Frage in Zwischenablage (funktioniert komplett kostenlos mit deinem bestehenden Claude-Konto)
        if (navigator.clipboard) {
          navigator.clipboard.writeText(prompt).then(() => {
            alert('Frage wurde kopiert! Öffne Claude und füge sie ein (Cmd+V bzw. Einfügen).');
            window.open('https://claude.ai/new', '_blank');
          }).catch(() => {
            window.open('https://claude.ai/new', '_blank');
          });
        } else {
          window.open('https://claude.ai/new', '_blank');
        }
      }

      render() {
        const app = document.getElementById('app');
        
        if (this.selectedArticle !== null) {
          // Detail View
          const article = this.articles[this.selectedArticle];
          if (!article) {
            app.innerHTML = '<div class="empty">Artikel nicht gefunden</div>';
            return;
          }

          app.innerHTML = `
            <div class="detail-view active">
              <div class="detail-header">
                <button class="detail-back">← Zurück</button>
                <h1 class="detail-headline">${article.headline}</h1>
                <div class="detail-meta">${article.source || 'Quelle'} · ${article.date || 'Datum'}</div>
              </div>
              <div class="detail-scroll">
                <div class="detail-content">
                  <p style="font-style: italic; color: var(--ink-soft); font-size: 0.82rem;">Schlagzeile & Kurzfassung auf Deutsch übersetzt · Originaltext unten auf Englisch</p>
                  ${article.content ? article.content.split('\n').map(p => `<p>${p}</p>`).join('') : '<p>' + article.summary + '</p>'}
                  <div class="detail-fazit">
                    <div class="detail-fazit-label">Weiterlesen</div>
                    <div class="detail-fazit-text">
                      ${article.link ? `<a href="${article.link}" target="_blank" style="color: var(--accent);">Zum Originalartikel bei ${article.source} →</a>` : 'Quelle: ' + article.source}
                    </div>
                  </div>
                  <button class="detail-ask-claude" data-ask="${index}">Mit Claude besprechen →</button>
                </div>
              </div>
            </div>
          `;
          
          document.querySelector('.detail-back').addEventListener('click', () => this.closeDetail());
          const askBtn = document.querySelector('[data-ask]');
          if (askBtn) askBtn.addEventListener('click', () => this.askClaude(this.selectedArticle));
        } else {
          // List View
          const articlesHtml = this.articles.length > 0
            ? this.articles.map((article, i) => `
              <div class="article-item" data-index="${i}">
                <div class="article-headline">${article.headline}</div>
                <div class="article-summary">${article.summary}</div>
                <div class="article-meta">${article.source || 'Quelle'} · ${article.date || 'Datum'}</div>
              </div>
            `).join('')
            : '<div class="empty">Keine Meldungen verfügbar. Bitte später versuchen.</div>';

          app.innerHTML = `
            <div id="app-inner" style="display: flex; flex-direction: column; height: 100%;">
              <div class="header">
                <h1 class="title">DEPESCHE</h1>
                <div class="subtitle">Internationale KI-News, täglich kuriert</div>
              </div>
              <div class="feed">${articlesHtml}</div>
            </div>
          `;

          // Attach listeners
          document.querySelectorAll('.article-item').forEach((item) => {
            item.addEventListener('click', () => {
              const index = parseInt(item.dataset.index);
              this.selectArticle(index);
            });
          });
        }
      }
    }

    new Depesche();
  </script>
</body>
</html>
